<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070712"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>SYSTEM: AWAKEN V4</title>
<style>
:root{--b:#070712;--p:#111126;--l:#303050;--t:#f5f4ff;--m:#9696b5;--a:#8b5cff;--c:#55dcff;--g:#55df9b;--r:#ff607e;--y:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#292050,#070712 65%);color:var(--t);font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;padding-bottom:80px}
header{position:sticky;top:0;z-index:5;padding:14px 16px;background:#080812e8;backdrop-filter:blur(12px);border-bottom:1px solid var(--l);display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:1px}.c{color:var(--c)}.online{font-size:11px;color:var(--g)}
main{padding:16px}.hero,.card,.quest,.ex{background:linear-gradient(145deg,var(--p),#0b0b16);border:1px solid var(--l);border-radius:18px;padding:15px}.hero{border-color:#4b437c}.ey{font-size:10px;color:var(--c);font-weight:900;letter-spacing:2px}.rank{font-size:58px;font-weight:1000;line-height:1;margin:6px 0}.muted,.small{color:var(--m);font-size:12px}.bar{height:10px;background:#25253e;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--a),var(--c))}.xp{display:flex;justify-content:space-between;font-size:11px;color:var(--m);margin:7px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}.stat b{font-size:24px}.label{font-size:10px;color:var(--m);letter-spacing:1px}.sec{margin:20px 0 8px;color:#bbb9d8;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{background:linear-gradient(135deg,#8050ff,#5638bf);color:white;border:0;border-radius:11px;padding:10px 13px;font-weight:900}.btn.alt{background:#22223e;border:1px solid #3b3b62}.btn.red{background:#391925;color:#ff9db0}.quest,.ex{margin:9px 0}.tag,.pill{font-size:10px;background:#222244;border-radius:8px;padding:4px 7px}.reward{color:var(--y);font-size:12px;font-weight:900}.ex{display:flex;gap:10px;align-items:center}.ico{width:38px;height:38px;background:#25254a;border-radius:10px;display:grid;place-items:center;font-size:19px}.grow{flex:1}.big{font-weight:900}.danger{border-left:3px solid var(--r);background:#211019;padding:11px;border-radius:8px;font-size:12px}.notice{border-left:3px solid var(--c);background:#101b2a;padding:11px;border-radius:8px;font-size:12px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#080812f5;border-top:1px solid var(--l);z-index:10}.tabsin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.tab{background:none;color:#777793;border:0;padding:8px;font-size:10px}.tab span{display:block;font-size:20px}.tab.active{color:white}.rankrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #25253e}.rankrow:last-child{border:0}.lock{opacity:.4}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center}.modal.show{display:flex}.sheet{background:#111126;border:1px solid var(--l);border-radius:20px;padding:20px;width:min(700px,94%);margin:auto}.sheet input,.sheet select{width:100%;background:#080812;color:white;border:1px solid var(--l);border-radius:10px;padding:11px;margin:5px 0 12px}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:white;color:#10101a;padding:10px 14px;border-radius:10px;font-weight:900;display:none;z-index:30}
</style></head><body><div class="app"><header><div class="brand">⚡ SYSTEM: AWAKEN <span class="c">V4</span></div><div id="net" class="online">● ONLINE</div></header><main id="main"></main></div>
<nav class="tabs"><div class="tabsin"><button class="tab active" data-page="home"><span>⌂</span>System</button><button class="tab" data-page="training"><span>⚔</span>Training</button><button class="tab" data-page="quests"><span>▤</span>Quests</button><button class="tab" data-page="ranks"><span>♜</span>Ränge</button></div></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
const KEY="awaken-v4",F={name:"Hunter",level:1,xp:0,rank:"E",streak:0,lastDay:"",daily:[],penalty:0,training:0,stats:{STR:5,AGI:5,VIT:5,END:5},goal:"Allgemeine Fitness",days:3};
let S=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(F),page="home";
const ranks=[["E",1,0,"Erwachender"],["D",10,10,"Kämpfer"],["C",25,35,"Elite-Kämpfer"],["B",45,80,"Veteran"],["A",70,150,"Meister"],["S",100,300,"S-Rang Hunter"]];
const ex=[
["push","◈","Liegestütze","STR",3,8,"Wiederholungen","60–90 Sek.",45,"Sauber und kontrolliert."],
["squat","◆","Kniebeugen","VIT",3,12,"Wiederholungen","60–90 Sek.",45,"Kontrollierte Bewegung."],
["plank","⬢","Plank","END",3,30,"Sekunden","60 Sek.",40,"Rumpf stabil halten."],
["run","➤","Ausdauer-Quest","AGI",1,15,"Minuten","locker",55,"15 Min. lockeres Laufen oder Lauf-/Geh-Wechsel."],
["mob","✦","Recovery Flow","VIT",1,8,"Minuten","—",30,"8 Min. lockere Mobilität."]
];
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function today(){return new Date().toISOString().slice(0,10)}
function xpNeed(){return Math.round(120*Math.pow(1.075,S.level-1))}
function rank(){let r="E";for(const x of ranks)if(S.level>=x[1]&&S.training>=x[2])r=x[0];return r}
function mult(){return 1+Math.min(.75,(S.level-1)*.025)}
function ensure(){if(S.lastDay!==today()){S.lastDay=today();S.daily=[];save()}}
function chosen(){let n=S.days>=5?4:3;let sets=S.training%3===0?[ex[0],ex[1],ex[3]]:S.training%3===1?[ex[0],ex[2],ex[3]]:[ex[1],ex[2],ex[4]];return n===4?[...sets,ex[(S.training%3===2)?3:4]]:sets}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display="none",2200)}
function addXP(n){S.xp+=n;let old=rank(),up=0;while(S.xp>=xpNeed()){S.xp-=xpNeed();S.level++;up++}S.rank=rank();save();if(up)toast("⚡ LEVEL UP → "+S.level);if(S.rank!==old)setTimeout(()=>toast("RANG AUF → "+S.rank),900)}
function complete(id){ensure();if(S.daily.includes(id))return;let e=ex.find(x=>x[0]===id);S.daily.push(id);S.stats[e[3]]++;S.training++;if(S.streak===0||S.lastCompleted!==today()){S.streak++;S.lastCompleted=today()}let reward=Math.round(e[8]*mult());addXP(reward);save();render(page);toast("Quest abgeschlossen +"+reward+" XP")}
function penalty(){ensure();if(S.daily.length>=chosen().length||S.penaltyDay===today())return;S.penaltyDay=today();S.penalty+=50;S.xp=Math.max(0,S.xp-50);save();toast("SYSTEM: -50 XP");render(page)}
function reset(){if(confirm("Fortschritt löschen?")){localStorage.removeItem(KEY);location.reload()}}
function setup(){open(`<h2>⚡ SYSTEM INITIALISIERUNG</h2><div class="notice">Das System erhöht die Belastung nur schrittweise. Keine körperlichen Strafübungen.</div><p class="small">Trainingstage sind bewusst begrenzt. Bei Schmerzen oder ungewöhnlichen Beschwerden: abbrechen und mit einer erwachsenen Vertrauensperson/Fachperson klären.</p><label>Name</label><input id="name" value="${S.name}"><label>Ziel</label><select id="goal"><option>Allgemeine Fitness</option><option>Kraft</option><option>Ausdauer</option><option>Beweglichkeit</option></select><label>Trainingstage pro Woche</label><select id="days"><option>2</option><option selected>3</option><option>4</option><option>5</option></select><button class="btn" style="width:100%" onclick="finish()">SYSTEM STARTEN</button>`)}
function finish(){S.name=document.getElementById("name").value.trim()||"Hunter";S.goal=document.getElementById("goal").value;S.days=+document.getElementById("days").value;save();close();render(page)}
function open(h){document.getElementById("sheet").innerHTML=h;document.getElementById("modal").classList.add("show")}function close(){document.getElementById("modal").classList.remove("show")}
function home(){let q=chosen(),d=S.daily.length,next=ranks.find(x=>x[1]>S.level||x[0]==="S")||ranks[5];return `<section class="hero"><div class="ey">HUNTER PROFILE · ${S.name.toUpperCase()}</div><div class="rank">${S.rank}</div><div class="muted">${ranks.find(x=>x[0]===S.rank)[3]} · LEVEL ${S.level}</div><div class="xp"><span>XP BIS LEVEL ${S.level+1}</span><span>${S.xp} / ${xpNeed()}</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,S.xp/xpNeed()*100)}%"></div></div><div class="row" style="margin-top:12px"><span>🔥 ${S.streak} Tage Streak</span><button class="btn alt" onclick="setup()">Anpassen</button></div></section>
<div class="grid"><div class="card stat"><div class="label">STR</div><b>${S.stats.STR}</b></div><div class="card stat"><div class="label">AGI</div><b>${S.stats.AGI}</b></div><div class="card stat"><div class="label">VIT</div><b>${S.stats.VIT}</b></div><div class="card stat"><div class="label">END</div><b>${S.stats.END}</b></div></div>
<div class="sec">Tagesquest</div><div class="card"><div class="row"><b>${d}/${q.length} erledigt</b><span class="reward">XP × ${mult().toFixed(2)}</span></div><p class="small">Exakte Sätze, Wiederholungen und Pausen findest du unter Training.</p><button class="btn" onclick="render('training')">TRAINING STARTEN</button></div>
<div class="sec">Rang-Barriere</div><div class="card"><b>Nächster Rang: ${next[0]}</b><p class="small">${next[3]} · ${next[1]===100?"Level 100 + 300 Trainings + 90 Tage Beständigkeit":next[1]+" + "+next[2]+" Trainings"}</p></div>
<div class="sec">System-Konsequenz</div><div class="danger">⚠ Verpasst du deine Tagesquests, kann das System <b>-50 XP</b> abziehen. Keine Strafübungen und kein erzwungenes Extra-Training.</div>`}
function training(){ensure();return `<h2>⚔ SYSTEM TRAINING</h2><p class="small">Level ${S.level} · ${S.days} Tage/Woche · Schwierigkeit ${Math.min(10,1+Math.floor((S.level-1)/10))}</p><div class="notice">Die Zahlen sind bewusst klar: Du weißt genau, was heute ansteht. Die Steigerung erfolgt langsam über mehrere Einheiten.</div>${chosen().map(e=>{let done=S.daily.includes(e[0]),amount=Math.round(e[5]*(1+Math.min(.5,Math.floor((S.level-1)/10)*.05)));return `<div class="ex ${done?'':'card'}"><div class="ico">${e[1]}</div><div class="grow"><div class="big">${e[2]}</div><div class="small"><b>${e[4]} × ${amount} ${e[6]}</b> · Pause: ${e[7]}</div><div class="small">${e[9]}</div></div><div>${done?'<span class="pill">✓</span>':`<div class="reward">+${Math.round(e[8]*mult())} XP</div><button class="btn" onclick="complete('${e[0]}')">ERLEDIGT</button>`}</div></div>`}).join("")}
<div class="sec">Wenn etwas zu schwer ist</div><div class="card"><p class="small">Reduziere die Wiederholungen bzw. Dauer oder nutze eine leichtere Variante. Das System soll dich fordern, nicht überfordern.</p></div>`}
function quests(){let q=chosen();return `<h2>▤ DAILY QUESTS</h2><div class="card"><b>${S.daily.length}/${q.length}</b><div class="bar" style="margin-top:8px"><div class="fill" style="width:${S.daily.length/q.length*100}%"></div></div></div>${q.map(e=>`<div class="quest"><div class="row"><span class="tag">${e[3]}</span><span class="reward">+${Math.round(e[8]*mult())} XP</span></div><h3>${e[2]}</h3><p class="small"><b>${e[4]} × ${e[5]} ${e[6]}</b></p>${S.daily.includes(e[0])?'<button class="btn alt">✓ ABGESCHLOSSEN</button>':`<button class="btn" onclick="complete('${e[0]}')">QUEST ABSCHLIESSEN</button>`}</div>`).join("")}<div class="sec">Bestrafung</div><div class="danger">Nicht erledigte Tagesquests → <b>-50 XP</b> als System-Konsequenz. XP kann nie unter 0 fallen.</div>`}
function ranksPage(){return `<h2>♜ RANG-SYSTEM</h2><div class="card"><p class="small">XP allein reicht nicht. Jeder Rang braucht zusätzlich ein langfristiges Trainingsziel.</p>${ranks.map(x=>{let ok=S.level>=x[1]&&S.training>=x[2];return `<div class="rankrow ${ok?'':'lock'}"><b style="font-size:28px;width:42px">${x[0]}</b><div class="grow"><b>${x[3]}</b><div class="small">Level ${x[1]} · ${x[2]} Trainings</div></div><span>${ok?'✓':'🔒'}</span></div>`}).join("")}</div><div class="sec">S-Rang</div><div class="card"><b>S ist Endgame.</b><p class="small">Für S brauchst du Level 100, mindestens 300 abgeschlossene Trainings und zusätzlich 90 Tage Beständigkeit. Damit ist der S-Rang nicht nach ein paar Wochen erreichbar.</p></div><div class="sec">Daten</div><div class="card"><p class="small">${S.training} Trainings · ${S.penalty} XP durch Konsequenzen verloren</p><button class="btn red" onclick="reset()">Fortschritt zurücksetzen</button></div>`}
function render(p="home"){page=p;ensure();document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.page===p));document.getElementById("main").innerHTML=p==="home"?home():p==="training"?training():p==="quests"?quests():ranksPage()}
document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>render(x.dataset.page));window.addEventListener("online",()=>net.textContent="● ONLINE");window.addEventListener("offline",()=>net.textContent="● OFFLINE");if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});render();if(!localStorage.getItem(KEY))setTimeout(setup,300);
</script></body></html>
