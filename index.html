<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070712">
<meta name="description" content="SYSTEM: AWAKEN V3 – gamifiziertes Training mit Quests, XP, Rängen und Fortschritt.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>SYSTEM: AWAKEN V3</title>
<style>
:root{--bg:#070712;--panel:#101022;--panel2:#15152d;--line:#29294b;--text:#f5f4ff;--muted:#9898b8;--accent:#8d5cff;--accent2:#5ee7ff;--good:#56e39f;--warn:#ffd166;--danger:#ff6b8a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#252052 0,#0d0d1d 38%,#070712 75%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}button{border:0;color:var(--text);cursor:pointer}
.app{max-width:760px;margin:auto;padding-bottom:90px}.top{position:sticky;top:0;z-index:5;background:#070712dd;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:1.5px}.online{font-size:11px;color:var(--good)}
.screen{padding:18px 16px}.hero{border:1px solid #3b3471;background:linear-gradient(135deg,#17142e,#0e1024);border-radius:24px;padding:20px;box-shadow:0 15px 45px #0005}.eyebrow{font-size:11px;color:var(--accent2);letter-spacing:2px;font-weight:800}.rank{font-size:54px;font-weight:1000;line-height:1;margin:8px 0}.level{color:var(--muted)}.bar{height:10px;background:#24243d;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.xptext{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:8px 0 5px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.card{background:linear-gradient(145deg,var(--panel),#0c0c18);border:1px solid var(--line);border-radius:18px;padding:15px}.stat b{font-size:23px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.section{margin:22px 0 10px;font-size:13px;color:#bbb9d8;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.quest{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.quest.done{opacity:.55}.quest h3{margin:0 0 6px;font-size:16px}.quest p{margin:0 0 12px;color:var(--muted);font-size:13px}.tag{display:inline-block;font-size:10px;padding:4px 7px;border-radius:8px;background:#202041;color:#bbb8ff;margin-right:5px}.btn{padding:11px 14px;border-radius:12px;background:linear-gradient(135deg,#7d4dff,#5940c7);font-weight:800}.btn.secondary{background:#202039;border:1px solid #36365c}.btn.good{background:#153b32;color:#7ff0bc;border:1px solid #28654f}.btn.danger{background:#3a1b28;color:#ff9ab1;border:1px solid #69344a}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#090916ef;backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}.tabs-inner{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.tab{background:none;padding:10px 4px;color:#777794;font-size:11px}.tab.active{color:white}.tab span{display:block;font-size:20px;margin-bottom:2px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:min(760px,100%);margin:auto;background:#111126;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}input,select{width:100%;background:#0a0a16;border:1px solid var(--line);color:white;border-radius:12px;padding:12px;margin:6px 0 12px}
.list{display:grid;gap:8px}.leader{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#111126;border:1px solid var(--line)}.leader.me{border-color:#7554ff;background:#171433}.pos{width:28px;text-align:center;font-weight:900}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#29294a}.grow{flex:1}.small{font-size:12px;color:var(--muted)}.badge{padding:5px 8px;border-radius:9px;background:#222244;font-size:11px;font-weight:800}
.empty{text-align:center;color:var(--muted);padding:30px 10px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(15px);opacity:0;background:#f4f2ff;color:#10101c;padding:11px 15px;border-radius:12px;font-weight:800;z-index:30;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.sheet{border-radius:24px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">⚡ SYSTEM: AWAKEN <span style="color:var(--accent2)">V3</span></div><div id="net" class="online">● ONLINE</div></header>
<main id="app"></main>
</div>
<nav class="tabs"><div class="tabs-inner">
<button class="tab active" data-tab="home"><span>⌂</span>System</button>
<button class="tab" data-tab="quests"><span>⚔</span>Quests</button>
<button class="tab" data-tab="rank"><span>♜</span>Rangliste</button>
<button class="tab" data-tab="profile"><span>◉</span>Status</button>
</div></nav>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>
<script>
const KEY="awaken_v3_state";
const defaultState={name:"Hunter",level:1,xp:0,rank:"E",streak:0,lastDone:null,stats:{STR:5,AGI:5,VIT:5,END:5},quests:[],history:[],achievements:[],onboard:false,goal:"Allgemeine Fitness",experience:"Anfänger",equipment:"Körpergewicht",days:3};
let S=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(defaultState);
const ranks=["E","D","C","B","A","S"];
const questPool=[
 {id:"push",title:"Power Push",desc:"Liegestütze – saubere, kontrollierte Wiederholungen.",cat:"STR",base:8},
 {id:"squat",title:"Shadow Squats",desc:"Kniebeugen mit kontrollierter Bewegung.",cat:"VIT",base:8},
 {id:"core",title:"Core Guard",desc:"Plank oder Dead Bug – stabil und kontrolliert.",cat:"END",base:7},
 {id:"run",title:"Agility Run",desc:"Kurze lockere Lauf-/Geh-Einheit oder zügiger Spaziergang.",cat:"AGI",base:10},
 {id:"mob",title:"Recovery Flow",desc:"Mobilität und lockeres Dehnen für die Regeneration.",cat:"VIT",base:6}
];
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function rankFor(l){return ranks[Math.min(5,Math.floor((l-1)/5))]}
function nextXP(){return 100+(S.level-1)*25}
function xpPct(){return Math.min(100,S.xp/nextXP()*100)}
function today(){return new Date().toISOString().slice(0,10)}
function seedQuests(){
 if(S.quests.some(q=>q.date===today())) return;
 const count=Math.max(2,Math.min(5,Number(S.days)||3));
 const offset=(S.level-1)%questPool.length;
 const qs=[...questPool.slice(offset),...questPool.slice(0,offset)].slice(0,count);
 const mult=1+Math.min(.7,(S.level-1)*.035);
 S.quests=qs.map((q,i)=>({...q,date:today(),done:false,reward:Math.round(q.base*mult),difficulty:Math.max(1,Math.round(1+(S.level-1)*.15)),order:i}));
 save();
}
function gainXP(n){S.xp+=n;let ups=0;while(S.xp>=nextXP()){S.xp-=nextXP();S.level++;ups++;}const old=S.rank;S.rank=rankFor(S.level);if(ups){toast("LEVEL UP! Level "+S.level);if(old!==S.rank) setTimeout(()=>toast("RANG AUFGESTIEGEN: "+S.rank),800)}}
function completeQuest(id){
 const q=S.quests.find(x=>x.id===id);if(!q||q.done)return;
 q.done=true;gainXP(q.reward);S.stats[q.cat]+=1;
 if(S.lastDone!==today()){S.streak++;S.lastDone=today()}
 S.history.unshift({date:today(),id,earned:q.reward});S.history=S.history.slice(0,100);
 if(S.history.length===1&&!S.achievements.includes("first"))S.achievements.push("first");
 if(S.streak>=7&&!S.achievements.includes("week"))S.achievements.push("week");
 save();render();toast("Quest abgeschlossen +"+q.reward+" XP");
}
function resetProgress(){if(confirm("Wirklich den lokalen Fortschritt löschen?")){localStorage.removeItem(KEY);S=structuredClone(defaultState);seedQuests();openOnboarding();}}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove("show"),2200)}
function openModal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()}
function openOnboarding(){
 openModal(`<h2>⚡ SYSTEM INITIALISIERUNG</h2><p class="small">Dein Training passt sich deinem Fortschritt an. Kein Schmerz- oder Bestrafungssystem: verpasste Quests führen nicht zu gefährlichen Zusatzübungen.</p>
<label>Name</label><input id="n" value="${S.name}">
<label>Trainingsziel</label><select id="g"><option>Allgemeine Fitness</option><option>Kraft</option><option>Ausdauer</option><option>Beweglichkeit</option></select>
<label>Erfahrung</label><select id="ex"><option>Anfänger</option><option>Fortgeschritten</option></select>
<label>Equipment</label><select id="eq"><option>Körpergewicht</option><option>Home-Gym</option><option>Fitnessstudio</option></select>
<label>Trainingstage pro Woche</label><select id="d"><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
<button class="btn" style="width:100%;margin-top:8px" onclick="finishOnboard()">SYSTEM STARTEN</button>`);
}
function finishOnboard(){S.name=document.getElementById("n").value.trim()||"Hunter";S.goal=document.getElementById("g").value;S.experience=document.getElementById("ex").value;S.equipment=document.getElementById("eq").value;S.days=+document.getElementById("d").value;S.onboard=true;save();closeModal();seedQuests();render()}
function home(){
 const completed=S.quests.filter(q=>q.done).length;
 return `<div class="screen"><section class="hero"><div class="eyebrow">HUNTER PROFILE · ${S.name.toUpperCase()}</div><div class="rank">${S.rank}</div><div class="level">LEVEL ${S.level} · ${S.goal}</div><div class="xptext"><span>XP</span><span>${S.xp} / ${nextXP()}</span></div><div class="bar"><div class="fill" style="width:${xpPct()}%"></div></div><div class="row" style="margin-top:15px"><span>🔥 ${S.streak} Tage Streak</span><button class="btn secondary" onclick="openOnboarding()">Anpassen</button></div></section>
<div class="grid"><div class="card stat"><div class="label">STR</div><b>${S.stats.STR}</b></div><div class="card stat"><div class="label">AGI</div><b>${S.stats.AGI}</b></div><div class="card stat"><div class="label">VIT</div><b>${S.stats.VIT}</b></div><div class="card stat"><div class="label">END</div><b>${S.stats.END}</b></div></div>
<div class="section">Heute</div><div class="card"><div class="row"><b>${completed}/${S.quests.length} Quests</b><span class="badge">${S.quests.filter(q=>q.done).reduce((a,q)=>a+q.reward,0)} XP</span></div><div class="small" style="margin-top:7px">${completed===S.quests.length?"Alle Quests abgeschlossen. Recovery ist jetzt deine Mission.":"Noch "+(S.quests.length-completed)+" Quest(s) offen."}</div></div>
<div class="section">System-Regel</div><div class="card"><b>Adaptive Schwierigkeit</b><p class="small">Wenn du mehrere Einheiten sicher schaffst, steigt die Herausforderung langsam. Wenn etwas zu schwer ist, kannst du es zurückstufen.</p></div></div>`
}
function quests(){
 return `<div class="screen"><h2>⚔ Daily Quests</h2><p class="small">Dein heutiges Set wird automatisch an dein Level angepasst.</p>${S.quests.map(q=>`<div class="quest ${q.done?"done":""}"><div class="row"><div><span class="tag">${q.cat}</span><span class="tag">+${q.reward} XP</span></div><span class="badge">Lv.${q.difficulty}</span></div><h3>${q.title}</h3><p>${q.desc}</p>${q.done?'<button class="btn good" disabled>✓ ABGESCHLOSSEN</button>':`<button class="btn" onclick="completeQuest('${q.id}')">QUEST ABSCHLIESSEN</button>`}</div>`).join("")}
<div class="card" style="margin-top:18px"><b>🛡 Recovery</b><p class="small">Ruhetage sind Teil des Systems. Du musst keine Extra-Übungen als Strafe machen.</p></div></div>`
}
const names=["Shadow Monarch","IronFang","Nova","Astra","Jin","Ragnar","Mira","SystemUser","Vortex","Kairo","HunterX"];
function leaderboard(){
 const rows=names.map((n,i)=>({n,lvl:Math.max(8,42-i*3),rank:rankFor(Math.max(8,42-i*3)),xp:8200-i*510,me:false}));
 rows.splice(4,0,{n:S.name,lvl:S.level,rank:S.rank,xp:S.level*100+S.xp,me:true});
 rows.sort((a,b)=>b.xp-a.xp);
 return `<div class="screen"><h2>♜ Welt-Rangliste</h2><p class="small">V3-Demo: echte globale Platzierung benötigt später ein Backend und Login.</p><div class="list">${rows.slice(0,15).map((r,i)=>`<div class="leader ${r.me?"me":""}"><div class="pos">${i+1}</div><div class="avatar">${r.rank}</div><div class="grow"><b>${r.n}</b><div class="small">Level ${r.lvl} · ${r.xp} XP</div></div><span class="badge">${r.rank}</span></div>`).join("")}</div></div>`
}
function profile(){
 const ach=[["first","First Awakening","Erste Quest abgeschlossen"],["week","7-Day Streak","7 Tage Aktivität"]];
 return `<div class="screen"><h2>◉ Status</h2><div class="card"><div class="row"><b>${S.name}</b><span class="badge">Rang ${S.rank}</span></div><p class="small">Level ${S.level} · ${S.experience} · ${S.equipment} · ${S.days} Tage/Woche</p></div>
<div class="section">Stats</div><div class="grid">${Object.entries(S.stats).map(([k,v])=>`<div class="card"><div class="label">${k}</div><b>${v}</b></div>`).join("")}</div>
<div class="section">Achievements</div>${ach.map(a=>`<div class="card" style="margin:8px 0"><div class="row"><b>${S.achievements.includes(a[0])?"🏆":"🔒"} ${a[1]}</b><span class="badge">${S.achievements.includes(a[0])?"UNLOCKED":"LOCKED"}</span></div><div class="small">${a[2]}</div></div>`).join("")}
<div class="section">Daten</div><div class="card"><button class="btn secondary" onclick="openModal('<h2>System</h2><p class=small>V3 speichert deinen Fortschritt lokal auf diesem Gerät. Für echtes Cloud-Sync und eine echte Welt-Rangliste braucht die App in einer nächsten Stufe ein Backend.</p><button class=\\'btn danger\\' onclick=\\'closeModal();resetProgress()\\'>Fortschritt zurücksetzen</button>')">Info & Einstellungen</button></div></div>`
}
function render(tab="home"){
 seedQuests();document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));
 document.getElementById("app").innerHTML=tab==="home"?home():tab==="quests"?quests():tab==="rank"?leaderboard():profile();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>render(t.dataset.tab));
window.addEventListener("online",()=>document.getElementById("net").textContent="● ONLINE");
window.addEventListener("offline",()=>document.getElementById("net").textContent="● OFFLINE");
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
if(!S.onboard) setTimeout(openOnboarding,250); else seedQuests();
render();
</script>
</body></html>
