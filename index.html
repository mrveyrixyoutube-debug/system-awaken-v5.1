<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>SYSTEM: AWAKEN</title><style>body{margin:0;background:#080b12;color:#eef3ff;font-family:system-ui;padding:18px}main{max-width:700px;margin:auto}.card{background:#101622;border:1px solid #263149;border-radius:16px;padding:16px;margin:12px 0}button{background:#8b5cf6;color:white;border:0;border-radius:10px;padding:11px 14px}.rank{font-size:56px;font-weight:900;color:#8b5cf6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px;background:#0b101a;border-radius:10px}#quests>div{border-top:1px solid #263149;padding:12px 0;display:flex;justify-content:space-between;gap:8px}</style></head><body><main><div class="card"><b>SYSTEM: AWAKEN</b><p id="online">OFFLINE MODE</p><div class="rank" id="rank">E</div><h2 id="name">Hunter</h2><p>Level <span id="level">1</span> · XP <span id="xp">0</span> · 🔥 <span id="streak">0</span></p></div><div class="card"><h2>Daily Quests</h2><div id="quests"></div></div><div class="card"><h2>Stats</h2><div class="grid"><div class="stat">STR <b id="str">1</b></div><div class="stat">AGI <b id="agi">1</b></div><div class="stat">VIT <b id="vit">1</b></div><div class="stat">END <b id="end">1</b></div></div></div><div class="card"><h2>Profil</h2><input id="nameInput" maxlength="24" placeholder="Hunter" style="padding:10px;width:90%"><button onclick="saveName()">Speichern</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='YOUR_SUPABASE_URL';const SUPABASE_KEY='YOUR_SUPABASE_PUBLISHABLE_KEY';let state=JSON.parse(localStorage.getItem('system_awaken_v51')||'null')||{name:'Hunter',level:1,xp:0,streak:0,str:1,agi:1,vit:1,end:1,done:{}};const qs=[['push','Push-Ups','3 × 8',45,'str'],['squat','Squats','3 × 12',45,'vit'],['plank','Plank','3 × 30 Sek.',40,'end'],['run','Ausdauer','15 Min.',55,'agi'],['mob','Recovery','8 Min.',30,'vit']];function save(){localStorage.setItem('system_awaken_v51',JSON.stringify(state))}function render(){for(const k of ['name','level','xp','streak','str','agi','vit','end'])document.getElementById(k).textContent=state[k];document.getElementById('nameInput').value=state.name;document.getElementById('quests').innerHTML=qs.map(q=>{const d=state.done[q[0]];return '<div><span><b>'+q[1]+'</b><br><small>'+q[2]+' · +'+q[3]+' XP</small></span><button '+(d?'disabled':'')+' onclick="completeQuest(\''+q[0]+'\')">'+(d?'✓':'Complete')+'</button></div>'}).join('')}function saveName(){const v=document.getElementById('nameInput').value.trim();if(v)state.name=v;save();render()}function completeQuest(id){if(state.done[id])return;const q=qs.find(x=>x[0]===id);state.done[id]=true;state.xp+=q[3];state[q[4]]++;if(state.xp>=120){state.xp-=120;state.level++}save();render()}render();</script></body></html>
